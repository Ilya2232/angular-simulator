<div class="login-page">
  <h1>Вход</h1>
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <input pInputText formControlName="username" placeholder="Логин" />
    <input pInputText type="password" formControlName="password" placeholder="Пароль" />
    <button pButton type="submit" [disabled]="loginForm.invalid">Войти</button>
  </form>
</div>
