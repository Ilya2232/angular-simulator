<div class="messages-container">
  @for (msg of (messageService.messages$ | async); track msg.id) {
  <ng-container [ngTemplateOutlet]="messageTemplate" [ngTemplateOutletContext]="{$implicit: msg}"></ng-container>
  }
</div>

<ng-template #messageTemplate let-message>
  <div class="toast-message" [ngClass]="'toast-' + message.type.toLowerCase()">
    <div class="toast-icon">
      <fa-icon [icon]="['fas', 'envelope']"></fa-icon>
    </div>
    <div class="toast-content">
      <div class="toast-title">{{ message.type }}</div>
      <div class="toast-text">{{ message.text }}</div>
    </div>
    <button class="toast-close" (click)="messageService.closeMessage(message.id)">&times;</button>
  </div>
</ng-template>
